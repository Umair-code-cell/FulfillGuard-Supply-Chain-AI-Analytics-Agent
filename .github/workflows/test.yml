name: Python tests and offline SQL oracle
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and security tests
        run: python -m pytest -q
      - name: Independent SQL-oracle benchmark (synthetic fixture only)
        run: |
          python -m scripts.make_fixture
          FG_DB_PATH=data/demo.db python -m scripts.eval_baseline --output eval/baseline_report.json
